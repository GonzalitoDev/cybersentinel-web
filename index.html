<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberSentinel Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Consola de seguridad oscura: riel de navegación + panel de trabajo; severidad por franja de color */
  --bg: #0a0f16;
  --panel: #101923;
  --panel-2: #16222f;
  --line: #223346;
  --text: #e3ebf2;
  --dim: #8b9bad;
  --green: #00e5a0;
  --blue: #38bdf8;
  --crit: #ff4d6d;
  --high: #ff8a3d;
  --med: #ffc53d;
  --low: #7dd3fc;
  --safe: #00e5a0;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-body); }
button, input, select { font: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
nav.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { font: 700 20px/1 var(--font-display); letter-spacing: .06em; padding: 4px 10px 2px; }
.brand b { color: var(--green); font-weight: 700; } .brand span { color: var(--blue); }
.brand-sub { font: 11px var(--font-mono); color: var(--dim); padding: 0 10px 16px; letter-spacing: .04em; }
nav.rail a { display: flex; justify-content: space-between; align-items: center; padding: 9px 10px; border-radius: 8px; color: var(--dim); text-decoration: none; font-weight: 500; }
nav.rail a:hover { background: var(--panel-2); color: var(--text); }
nav.rail a.on { background: rgba(0, 229, 160, .1); color: var(--green); }
nav.rail .count { font: 11px var(--font-mono); background: var(--panel-2); border-radius: 10px; padding: 1px 7px; color: var(--dim); }
nav.rail .foot { margin-top: auto; font-size: 12px; color: var(--dim); padding: 10px; border-top: 1px solid var(--line); }

main { padding: 26px clamp(16px, 4vw, 44px) 60px; max-width: 1120px; width: 100%; }
h1 { font: 600 26px/1.2 var(--font-display); margin: 0 0 4px; text-wrap: balance; letter-spacing: .02em; }
h2 { font: 600 13px var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--blue); margin: 28px 0 10px; }
.lead { color: var(--dim); margin: 0 0 18px; max-width: 70ch; }
.muted { color: var(--dim); } .small { font-size: 13px; } .mono { font-family: var(--font-mono); font-size: 12px; word-break: break-all; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 10px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--blue); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--green); color: #00281b; border-color: var(--green); }
.btn.blue { background: transparent; color: var(--blue); border-color: var(--blue); }
.btn.danger { background: transparent; color: var(--crit); border-color: rgba(255, 77, 109, .6); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--blue); padding: 6px 8px; }
.btn.big { padding: 14px 20px; font-size: 16px; }

.hero { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: center; }
.ring { position: relative; width: 210px; height: 210px; }
.ring svg { width: 100%; height: 100%; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 30px; }
.ring .lvl { font: 700 24px var(--font-display); letter-spacing: .05em; }
.ring .txt { font-size: 12px; color: var(--dim); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .45; } }
.spinning { transform-origin: 50% 50%; animation: spin 2.4s linear infinite; }
.pulsing { animation: pulse 2.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .spinning, .pulsing { animation: none; } }

.tile .n { font: 600 28px var(--font-display); font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--dim); }

.pill { font: 700 11px var(--font-mono); padding: 3px 8px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap; letter-spacing: .04em; }
.L-CRITICAL { color: var(--crit); } .L-HIGH { color: var(--high); } .L-MEDIUM { color: var(--med); } .L-LOW { color: var(--low); } .L-SAFE { color: var(--safe); }
.bg-CRITICAL { background: rgba(255, 77, 109, .12); } .bg-HIGH { background: rgba(255, 138, 61, .12); } .bg-MEDIUM { background: rgba(255, 197, 61, .1); } .bg-LOW { background: rgba(125, 211, 252, .1); } .bg-SAFE { background: rgba(0, 229, 160, .1); }

.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 4px 1fr auto; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 0; cursor: pointer; text-align: left; color: inherit; width: 100%; }
.item:hover { border-color: var(--blue); }
.item .stripe { align-self: stretch; border-radius: 0 3px 3px 0; }
.item .name { font-weight: 600; overflow-wrap: anywhere; }
.item .sub { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
.s-CRITICAL { background: var(--crit); } .s-HIGH { background: var(--high); } .s-MEDIUM { background: var(--med); } .s-LOW { background: var(--low); } .s-SAFE { background: var(--line); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--dim); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.chip.on { border-color: var(--green); color: var(--green); background: rgba(0, 229, 160, .08); }

.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--dim); }
.drop.over { border-color: var(--green); color: var(--green); background: rgba(0, 229, 160, .05); }

.progress { height: 8px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); width: 0; transition: width .2s; }
.progress.indet > div { width: 30%; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.kv { display: grid; grid-template-columns: 180px 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; overflow-wrap: anywhere; }
ul.reasons { margin: 0; padding-left: 18px; } ul.reasons li { margin: 4px 0; }

.modal-bg { position: fixed; inset: 0; background: rgba(3, 7, 12, .72); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(720px, 100%); max-height: 88vh; overflow: auto; padding: 22px; }
.modal h3 { font: 600 20px var(--font-display); margin: 0 0 6px; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--green); color: var(--text); padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: 90vw; }
.banner { border: 1px solid rgba(255, 197, 61, .5); background: rgba(255, 197, 61, .07); color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
input[type="text"], input[type="number"] { background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 11px; width: 100%; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t td, table.t th { border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: left; vertical-align: top; }
table.t th { color: var(--dim); font-weight: 500; }
.hidden { display: none !important; }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  nav.rail { position: sticky; top: 0; z-index: 10; height: auto; flex-direction: row; overflow-x: auto; padding: 8px; gap: 2px; }
  nav.rail .brand, nav.rail .brand-sub, nav.rail .foot { display: none; }
  nav.rail a { white-space: nowrap; padding: 8px 10px; }
  .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .hero .row { justify-content: center; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 6px; }
}
@media (max-width: 400px) { .g2 { grid-template-columns: 1fr; } }

</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Secciones">
    <div class="brand"><b>CYBER</b><span>SENTINEL</span></div>
    <div class="brand-sub">ANÁLISIS LOCAL · SIN SUBIDAS</div>
    <a href="#inicio">Inicio</a>
    <a href="#archivos">Archivos</a>
    <a href="#apk">APK y apps</a>
    <a href="#informe">Informe</a>
    <a href="#historial">Historial</a>
    <a href="#cuarentena">Cuarentena <span class="count" id="nav-q">0</span></a>
    <a href="#ajustes">Configuración</a>
    <a href="#registro">Registro</a>
    <div class="foot">Los archivos se analizan en este navegador y nunca se envían a ningún servidor.</div>
  </nav>
  <main id="main"><p class="muted">Cargando…</p></main>
</div>
<input type="file" id="in-folder" class="hidden" webkitdirectory multiple>
<input type="file" id="in-files" class="hidden" multiple>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =====================================================================
   CyberSentinel Web — motor de análisis (100 % local, sin red)
   ===================================================================== */
const CS = (() => {
  'use strict';

  // ------------------------------------------------------------ niveles
  const LEVELS = ['SAFE', 'LOW', 'MEDIUM', 'HIGH', 'CRITICAL'];
  const LABEL = { SAFE: 'SEGURO', LOW: 'BAJO', MEDIUM: 'MEDIO', HIGH: 'ALTO', CRITICAL: 'CRÍTICO' };
  const W = { SAFE: 0, LOW: 1, MEDIUM: 2, HIGH: 3, CRITICAL: 4 };
  const maxLevel = (a, b) => (W[a] >= W[b] ? a : b);

  // ------------------------------------------------------------ SHA-256 incremental
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);

  class Sha256 {
    constructor() {
      this.h = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
      this.buf = new Uint8Array(64); this.bufLen = 0; this.total = 0; this.w = new Uint32Array(64);
    }
    _block(b, off) {
      const w = this.w, h = this.h;
      for (let i = 0; i < 16; i++) { const j = off + i * 4; w[i] = (b[j] << 24) | (b[j + 1] << 16) | (b[j + 2] << 8) | b[j + 3]; }
      for (let i = 16; i < 64; i++) {
        const x = w[i - 15], y = w[i - 2];
        const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
        const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let a = h[0], bb = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const mj = (a & bb) ^ (a & c) ^ (bb & c);
        const t2 = (S0 + mj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
      }
      h[0] += a; h[1] += bb; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += hh;
    }
    update(data) {
      let i = 0; const n = data.length; this.total += n;
      if (this.bufLen) {
        while (i < n && this.bufLen < 64) this.buf[this.bufLen++] = data[i++];
        if (this.bufLen === 64) { this._block(this.buf, 0); this.bufLen = 0; }
      }
      for (; i + 64 <= n; i += 64) this._block(data, i);
      while (i < n) this.buf[this.bufLen++] = data[i++];
    }
    hex() {
      const bits = this.total * 8;
      const pad = new Uint8Array(((this.bufLen < 56 ? 56 : 120) - this.bufLen) + 8);
      pad[0] = 0x80;
      const hi = Math.floor(bits / 0x100000000), lo = bits >>> 0;
      const p = pad.length - 8;
      pad[p] = hi >>> 24; pad[p + 1] = hi >>> 16; pad[p + 2] = hi >>> 8; pad[p + 3] = hi;
      pad[p + 4] = lo >>> 24; pad[p + 5] = lo >>> 16; pad[p + 6] = lo >>> 8; pad[p + 7] = lo;
      const total = this.total; this.update(pad); this.total = total;
      return Array.from(this.h, x => (x >>> 0).toString(16).padStart(8, '0')).join('');
    }
  }

  const readSlice = async (file, start, end) => new Uint8Array(await file.slice(start, end).arrayBuffer());

  // ------------------------------------------------------------ tipos reales
  const T = {
    APK: { label: 'Paquete Android (APK)', exec: true, archive: true },
    DEX: { label: 'Código ejecutable Android (DEX)', exec: true },
    ELF: { label: 'Binario ejecutable Linux/Android (ELF)', exec: true },
    PE: { label: 'Ejecutable de Windows (EXE/DLL)', exec: true },
    JAR: { label: 'Archivo Java (JAR)', exec: true, archive: true },
    SCRIPT: { label: 'Script ejecutable (#!)' },
    ZIP: { label: 'Archivo comprimido ZIP', archive: true },
    OOXML: { label: 'Documento de Office (DOCX/XLSX/PPTX)', archive: true },
    OLE2: { label: 'Documento de Office antiguo (DOC/XLS/PPT)' },
    PDF: { label: 'Documento PDF' },
    RAR: { label: 'Archivo comprimido RAR', archive: true },
    SEVEN_Z: { label: 'Archivo comprimido 7z', archive: true },
    GZIP: { label: 'Archivo comprimido GZIP', archive: true },
    PNG: { label: 'Imagen PNG' }, JPEG: { label: 'Imagen JPEG' }, GIF: { label: 'Imagen GIF' },
    WEBP: { label: 'Imagen WebP' }, BMP: { label: 'Imagen BMP' },
    ISO_MEDIA: { label: 'Audio/video/imagen ISO (MP4/M4A/3GP/HEIC)' },
    MP3: { label: 'Audio MP3' }, OGG: { label: 'Audio OGG/Opus' }, WAV: { label: 'Audio WAV' },
    AVI: { label: 'Video AVI' }, MATROSKA: { label: 'Video MKV/WebM' },
    HTML: { label: 'Página HTML' }, TEXT: { label: 'Texto' }, EMPTY: { label: 'Archivo vacío' }, UNKNOWN: { label: 'Desconocido' }
  };
  for (const k in T) T[k].id = k;

  const DOC_MEDIA_EXT = new Set(['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'odt', 'ods', 'odp', 'rtf', 'txt', 'csv',
    'jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'heic', 'heif', 'svg', 'mp3', 'm4a', 'aac', 'ogg', 'opus', 'wav', 'flac', 'amr',
    'mp4', '3gp', 'mkv', 'webm', 'mov', 'avi']);
  const EXEC_EXT = new Set(['apk', 'xapk', 'apks', 'apkm', 'dex', 'so', 'jar', 'exe', 'scr', 'com', 'pif', 'bat', 'cmd', 'msi', 'dll',
    'vbs', 'vbe', 'js', 'jse', 'wsf', 'ps1', 'hta', 'lnk', 'sh', 'elf']);
  const EXPECTED = {
    pdf: ['PDF'], jpg: ['JPEG'], jpeg: ['JPEG'], png: ['PNG'], gif: ['GIF'], webp: ['WEBP'], bmp: ['BMP'],
    heic: ['ISO_MEDIA'], heif: ['ISO_MEDIA'], mp4: ['ISO_MEDIA'], m4a: ['ISO_MEDIA'], '3gp': ['ISO_MEDIA'], mov: ['ISO_MEDIA'],
    mp3: ['MP3'], ogg: ['OGG'], opus: ['OGG'], wav: ['WAV'], avi: ['AVI'], mkv: ['MATROSKA'], webm: ['MATROSKA'],
    docx: ['OOXML'], xlsx: ['OOXML'], pptx: ['OOXML'], docm: ['OOXML'], xlsm: ['OOXML'], pptm: ['OOXML'],
    doc: ['OLE2'], xls: ['OLE2'], ppt: ['OLE2'], zip: ['ZIP', 'OOXML', 'JAR', 'APK'], apk: ['APK'], jar: ['JAR', 'ZIP'], dex: ['DEX'],
    exe: ['PE'], dll: ['PE'], scr: ['PE'], rar: ['RAR'], '7z': ['SEVEN_Z'], gz: ['GZIP'], tgz: ['GZIP'],
    txt: ['TEXT', 'EMPTY'], csv: ['TEXT', 'EMPTY'], html: ['HTML', 'TEXT'], htm: ['HTML', 'TEXT']
  };

  const extOf = name => { const d = name.lastIndexOf('.'); return d <= 0 || d === name.length - 1 ? '' : name.slice(d + 1).trim().toLowerCase(); };

  function detectType(h) {
    const n = h.length;
    if (!n) return 'EMPTY';
    const at = (off, ...b) => off + b.length <= n && b.every((v, i) => h[off + i] === v);
    const asc = (off, s) => at(off, ...Array.from(s, c => c.charCodeAt(0)));
    if (at(0, 0x50, 0x4B, 0x03, 0x04) || at(0, 0x50, 0x4B, 0x05, 0x06)) return 'ZIP';
    if (asc(0, 'dex\n')) return 'DEX';
    if (at(0, 0x7F, 0x45, 0x4C, 0x46)) return 'ELF';
    if (asc(0, 'MZ') && n >= 64) return 'PE';
    if (asc(0, '%PDF')) return 'PDF';
    if (at(0, 0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1)) return 'OLE2';
    if (asc(0, 'Rar!')) return 'RAR';
    if (at(0, 0x37, 0x7A, 0xBC, 0xAF, 0x27, 0x1C)) return 'SEVEN_Z';
    if (at(0, 0x1F, 0x8B)) return 'GZIP';
    if (at(0, 0x89, 0x50, 0x4E, 0x47)) return 'PNG';
    if (at(0, 0xFF, 0xD8, 0xFF)) return 'JPEG';
    if (asc(0, 'GIF8')) return 'GIF';
    if (asc(0, 'RIFF') && asc(8, 'WEBP')) return 'WEBP';
    if (asc(0, 'RIFF') && asc(8, 'WAVE')) return 'WAV';
    if (asc(0, 'RIFF') && asc(8, 'AVI ')) return 'AVI';
    if (asc(4, 'ftyp')) return 'ISO_MEDIA';
    if (asc(0, 'ID3') || (n > 1 && h[0] === 0xFF && (h[1] & 0xE0) === 0xE0)) return 'MP3';
    if (asc(0, 'OggS')) return 'OGG';
    if (at(0, 0x1A, 0x45, 0xDF, 0xA3)) return 'MATROSKA';
    if (asc(0, 'BM') && n > 26) return 'BMP';
    if (asc(0, '#!')) return 'SCRIPT';
    const m = Math.min(n, 1024); let printable = 0;
    for (let i = 0; i < m; i++) {
      const b = h[i];
      if (b === 0) return 'UNKNOWN';
      if (b === 9 || b === 10 || b === 13 || (b >= 32 && b <= 126) || b >= 0x80) printable++;
    }
    if (printable < m * 0.95) return 'UNKNOWN';
    const start = new TextDecoder().decode(h.subarray(0, Math.min(m, 512))).trimStart().toLowerCase();
    return start.startsWith('<!doctype html') || start.startsWith('<html') ? 'HTML' : 'TEXT';
  }

  // ------------------------------------------------------------ lectura en una pasada
  const enc = s => new TextEncoder().encode(s);
  const utf16 = s => { const u = new Uint8Array(s.length * 2); for (let i = 0; i < s.length; i++) u[i * 2] = s.charCodeAt(i); return u; };
  const PATTERNS = {
    PDF: { pdf_js: enc('/JavaScript'), pdf_launch: enc('/Launch'), pdf_embedded: enc('/EmbeddedFile') },

      if (c.apk.verdict.sensitive.length) reasons.push('Permisos sensibles solicitados: ' + c.apk.verdict.sensitive.map(permLabel).join(', '));
      for (const r of c.apk.verdict.reasons) reasons.push(r);

    } else if (real === 'APK') add('LOW', 'Instalador APK', 'Instalador APK fuera de una tienda (no se pudo leer su manifiesto). Instalalo sólo si conocés el origen.');

    if (c.readError) reasons.push('No se pudo leer el contenido completo: ' + c.readError);
    if (c.hashSkipped) reasons.push('SHA-256 no calculado: el archivo supera el límite configurado.');
    if (c.trusted && level !== 'CRITICAL' && level !== 'SAFE') {
      reasons.push('Marcado como confiable por vos: no cuenta para el nivel de riesgo.');
      level = 'SAFE'; title = 'Marcado como confiable';
    }
    if (level === 'SAFE' && isHidden) title = 'Archivo oculto';
    return { level, title, reasons, isHidden };
  }

  /** Analiza un archivo completo. ctx: { path, hashLimit, lookupSig(hash), isTrusted(hash), isCancelled() } */
  async function analyzeFile(file, ctx) {
    let content = null, readError = null;

            } catch (_) { /* manifiesto ilegible */ }

    }

    const signature = sha ? await ctx.lookupSig(sha) : null;
    const trusted = sha ? await ctx.isTrusted(sha) : false;
    const v = evaluateFile({
      name: file.name, path: ctx.path, realType, signature, eicar: content && content.eicar,
      patterns: content && content.patterns, zip, apk, trusted, readError,
      hashSkipped: !readError && !sha && file.size > ctx.hashLimit

      kind: 'FILE', level: v.level, title: v.title, reasons: v.reasons, name: file.name, path: ctx.path,
      location: ctx.path.split('/').slice(0, -1).join('/') || '(raíz)', size: file.size,
      modifiedAt: file.lastModified || null, sha256: sha, realType, realTypeLabel: T[realType].label,
      isHidden: v.isHidden || ctx.path.split('/').slice(0, -1).some(s => s.startsWith('.')),
      packageName: apk ? apk.manifest.package : null
    };
  }

  function overallText(level) {
    return {
      CRITICAL: 'En riesgo: hay amenazas confirmadas', HIGH: 'Atención: hay elementos muy sospechosos',
      MEDIUM: 'Revisar: hay elementos que requieren revisión', LOW: 'Aceptable: sólo elementos poco habituales',
      SAFE: 'Sin amenazas conocidas detectadas'

  }

  return { LEVELS, LABEL, W, maxLevel, Sha256, detectType, readContent, zipEntries, extractEntry, classifyZip, parseAXML,

})();

    let seq = 1;

      try {
        const r = indexedDB.open('cybersentinel-web', 1);

      get persistent() { return !!db; },
      open,
      async getSig(h) { if (!db) return mem.sigs.get(h) || null; return (await req(tx('sigs').get(h))) || null; },
      async countSigs() { if (!db) return mem.sigs.size; return req(tx('sigs').count()); },

        return new Promise((res, rej) => {
          const t = db.transaction('sigs', 'readwrite'); const st = t.objectStore('sigs'); let added = 0;
          for (const s of list) { const g = st.get(s.h); g.onsuccess = () => { if (!g.result) { st.put(s); added++; } }; }

      },
      async sigSources() {

        return new Promise(res => {
          const c = tx('sigs').openCursor();

      },
      async deleteSource(src) {

        return new Promise(res => {
          const t = db.transaction('sigs', 'readwrite'); const c = t.objectStore('sigs').openCursor();
          c.onsuccess = () => { const cur = c.result; if (cur) { if (cur.value.source === src) cur.delete(); cur.continue(); } };

      },
      async addScan(s) { if (!db) { s.id = seq++; mem.scans.set(s.id, s); return s.id; } return req(tx('scans', 'readwrite').add(s)); },
      async putScan(s) { if (!db) { mem.scans.set(s.id, s); return; } return req(tx('scans', 'readwrite').put(s)); },
      async scans() { const l = db ? await req(tx('scans').getAll()) : [...mem.scans.values()]; return l.sort((a, b) => b.startedAt - a.startedAt); },
      async scan(id) { return db ? (await req(tx('scans').get(id))) || null : mem.scans.get(id) || null; },
      async deleteScan(id) {
        if (!db) { mem.scans.delete(id); for (const [k, f] of mem.findings) if (f.scanId === id) mem.findings.delete(k); return; }
        const fs = await this.findings(id);
        const t = db.transaction(['scans', 'findings'], 'readwrite');
        t.objectStore('scans').delete(id); for (const f of fs) t.objectStore('findings').delete(f.id);

      },
      async addFindings(list) {
        if (!db) { for (const f of list) { f.id = seq++; mem.findings.set(f.id, f); } return; }
        const t = db.transaction('findings', 'readwrite'); const st = t.objectStore('findings');

      async putFinding(f) { if (!db) { mem.findings.set(f.id, f); return; } return req(tx('findings', 'readwrite').put(f)); },

      },

      async isTrusted(h) { if (!db) return mem.trusted.has(h); return !!(await req(tx('trusted').get(h))); },

      async qGet(id) { return db ? (await req(tx('quarantine').get(id))) || null : mem.quarantine.get(id) || null; },
      async qDelete(id) { if (!db) { mem.quarantine.delete(id); return; } return req(tx('quarantine', 'readwrite').delete(id)); },

    };
  })();

  const settings = (() => {
    let s = { hashMb: 100 };
    try { s = Object.assign(s, JSON.parse(localStorage.getItem('cs-settings') || '{}')); } catch (_) { }

      get hashMb() { return s.hashMb; },
      set hashMb(v) { s.hashMb = Math.max(5, Math.min(2048, v | 0)); try { localStorage.setItem('cs-settings', JSON.stringify(s)); } catch (_) { } }
    };

    lastResult: null, reportId: null, filesFilter: 'risky', minLevel: 'LOW',

    downloads: null, sigCount: 0, qCount: 0

  // ================================================================ recolección de archivos
  /** Recorre una carpeta abierta con el selector moderno (permite cuarentena real). */
  async function walkHandle(dir, prefix, out) {

      await new Promise(r => entry.file(f => { out.files.push({ file: f, path }); r(); }, () => { out.errors++; r(); }));

        const now = performance.now();
        if (now - last > 100) { last = now; setProgress({ phase: 'Analizando archivos…', current: i, total: files.length, item: path }); }
        // Rápido: imágenes, audio y video grandes se evalúan por encabezado, sin hash completo.
        const quickSkip = mode === 'QUICK' && MEDIA_EXT.has(CS.extOf(file.name)) && file.size > 2 * 1024 * 1024;
        const r = await CS.analyzeFile(file, {
          path, hashLimit: quickSkip ? -1 : hashLimit, isCancelled,

        findings.push({ kind: 'DIR', level: 'SAFE', title: 'Carpeta oculta', name: d.split('/').pop(), path: d,
          location: d.split('/').slice(0, -1).join('/'), isHidden: true, isDirectory: true,
          reasons: [`Carpeta oculta (su nombre empieza con punto) con ${inside} archivo(s) analizado(s).`] });

    } catch (e) {
      if (e.message === 'cancelado') { scan.status = 'CANCELLED'; scan.notes.push('Análisis cancelado: los resultados son parciales.'); }
      else { scan.status = 'FAILED'; scan.notes.push('Error durante el análisis: ' + (e.message || e)); }
    }

    await Store.addFindings(findings);
    const risky = findings.filter(f => f.level !== 'SAFE');
    scan.critical = risky.filter(f => f.level === 'CRITICAL').length;
    scan.high = risky.filter(f => f.level === 'HIGH').length;
    scan.medium = risky.filter(f => f.level === 'MEDIUM').length;
    scan.low = risky.filter(f => f.level === 'LOW').length;
    scan.level = risky.reduce((m, f) => CS.maxLevel(m, f.level), 'SAFE');
    scan.finishedAt = Date.now();
    if (scan.errors) scan.notes.push(`${scan.errors} elemento(s) no se pudieron leer por completo.`);
    await Store.putScan(scan);
    await Store.log('Análisis ' + ({ COMPLETED: 'finalizado', CANCELLED: 'cancelado', FAILED: 'con errores' }[scan.status]),
      `#${scan.id}: ${scan.files} archivos, ${scan.critical} confirmadas, ${scan.high + scan.medium + scan.low} sospechosos, ${fmtDur(scan.finishedAt - started)}`);
    state.running = false;
    state.lastResult = { id: scan.id, text: scan.status === 'COMPLETED' ? `Análisis terminado en ${fmtDur(scan.finishedAt - started)}` : (scan.notes[0] || 'Análisis terminado') };
    state.reportId = scan.id;
    await refreshCounts();
    go('informe');
  }

  // ================================================================ recomendaciones
  function currentLevel(findings) {
    return findings.filter(f => f.status === 'OPEN' && f.level !== 'SAFE').reduce((m, f) => CS.maxLevel(m, f.level), 'SAFE');
  }
  function recommendations(scan, findings, sigCount) {
    const out = [];
    const open = findings.filter(f => f.status === 'OPEN');
    const crit = open.filter(f => f.level === 'CRITICAL');
    const high = open.filter(f => f.level === 'HIGH');
    if (crit.length) out.push(`Aislá o borrá los ${crit.length} archivo(s) con amenaza confirmada. No los abras ni los instales.`);
    if (high.length) out.push(`Revisá los ${high.length} archivo(s) de riesgo ALTO (extensiones engañosas, APK sospechosos, ejecutables ocultos). Si no los reconocés, eliminalos.`);
    if (open.some(f => f.realType === 'APK')) out.push('Borrá los instaladores APK que ya no necesites e instalá apps preferentemente desde tiendas oficiales.');
    if (open.some(f => /macros/i.test(f.title))) out.push('No habilites macros en documentos de Office salvo que confíes en quien te los envió.');
    if (open.some(f => f.realType === 'PE')) out.push('No copies a una PC los programas de Windows encontrados si no sabés de dónde salieron.');
    if (sigCount <= 1) out.push('La base de firmas sólo tiene la firma de prueba EICAR. Importá una lista de hashes (por ejemplo, de MalwareBazaar) en Ajustes para detectar malware conocido.');
    if (scan.status === 'CANCELLED') out.push('El análisis se canceló; repetilo completo para tener resultados totales.');
    if (!out.length) out.push('No se encontraron problemas en los archivos analizados. Repetí el análisis cuando descargues archivos nuevos.');
    return out;
  }

  // ================================================================ cuarentena
  const KEY = new TextEncoder().encode('CyberSentinel-Quarantine');
  const xor = (u8, off = 0) => { for (let i = 0; i < u8.length; i++) u8[i] ^= KEY[(off + i) % KEY.length]; return u8; };
  const shaOf = u8 => { const h = new CS.Sha256(); h.update(u8); return h.hex(); };

  async function quarantine(f) {
    const ref = state.handles.get(f.path);
    if (!ref) throw new Error('El navegador no permite borrar archivos elegidos con el selector clásico. Abrí la carpeta con "Elegir carpeta" en Chrome o Edge de computadora para poder aislarlos.');
    const file = await (await ref.parent.getFileHandle(ref.name)).getFile();
    const plain = new Uint8Array(await file.arrayBuffer());
    const sha = shaOf(plain);
    const stored = xor(plain.slice());
    if (shaOf(xor(stored.slice())) !== sha) throw new Error('La copia de cuarentena no coincide con el original. No se modificó nada.');
    const q = { name: ref.name, path: f.path, sha, size: plain.length, at: Date.now(), reason: `${CS.LABEL[f.level]}: ${f.title}`, data: stored.buffer, parent: ref.parent, findingId: f.id };
    let id;
    try { id = await Store.addQ(q); } catch (e) {
      // Algunos navegadores no guardan el acceso a la carpeta: se guarda sin él (sólo se podrá eliminar).
      q.parent = null; id = await Store.addQ(q);
    }
    try {
      if (await ref.parent.queryPermission({ mode: 'readwrite' }) !== 'granted' && await ref.parent.requestPermission({ mode: 'readwrite' }) !== 'granted') throw new Error('sin permiso de escritura');
      await ref.parent.removeEntry(ref.name);
    } catch (e) {
      await Store.qDelete(id);
      throw new Error('No se pudo quitar el archivo de su carpeta (' + (e.message || e.name) + '). No se modificó nada.');
    }
    state.handles.delete(f.path);
    f.status = 'QUARANTINED'; await Store.putFinding(f);
    await Store.log('Cuarentena', `${f.path} — SHA-256 ${sha} — motivo: ${q.reason}`);
  }

  async function restore(q) {
    if (!q.parent) throw new Error('Este navegador no conservó el acceso a la carpeta original. Podés eliminar la copia de la cuarentena.');
    if (await q.parent.queryPermission({ mode: 'readwrite' }) !== 'granted' && await q.parent.requestPermission({ mode: 'readwrite' }) !== 'granted')
      throw new Error('Sin permiso para escribir en la carpeta original.');
    let name = q.name;
    try { await q.parent.getFileHandle(name); const d = name.lastIndexOf('.'); name = d > 0 ? name.slice(0, d) + ' (restaurado)' + name.slice(d) : name + ' (restaurado)'; } catch (_) { }
    const plain = xor(new Uint8Array(q.data.slice(0)));
    const fh = await q.parent.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(plain); await w.close();
    const back = new Uint8Array(await (await fh.getFile()).arrayBuffer());
    if (shaOf(back) !== q.sha) { await q.parent.removeEntry(name); throw new Error('Verificación fallida al restaurar. El archivo sigue en cuarentena.'); }
    await Store.qDelete(q.id);
    if (q.findingId) { const f = await Store.finding(q.findingId); if (f) { f.status = 'RESTORED'; await Store.putFinding(f); } }
    await Store.log('Restaurado', `${q.path} → ${name}`);
    return name;
  }

  async function deleteQ(q) {
    await Store.qDelete(q.id);
    if (q.findingId) { const f = await Store.finding(q.findingId); if (f) { f.status = 'DELETED'; await Store.putFinding(f); } }
    await Store.log('Eliminado definitivamente', `${q.path} — SHA-256 ${q.sha}`);
  }

  // ================================================================ firmas
  async function importSignatures(file, onProgress) {
    const source = 'Importada: ' + file.name;
    let read = 0, added = 0, invalid = 0;
    const hexRe = /\b[0-9a-fA-F]{64}\b/;
    async function consumeText(text) {
      let shaCol = -1, sigCol = -1, typeCol = -1, batch = [];
      const lines = text.split(/\r?\n/);
      const split = l => l.split(',').map(x => x.trim().replace(/^"|"$/g, '').trim());
      for (const raw of lines) {
        const line = raw.trim(); if (!line) continue;
        if (line.includes('sha256_hash') && shaCol < 0) {
          const cols = split(line.replace(/^#\s*/, '')); shaCol = cols.indexOf('sha256_hash'); sigCol = cols.indexOf('signature'); typeCol = cols.indexOf('file_type_guess'); continue;
        }
        if (line.startsWith('#')) continue;
        let h = null, name = `Malware conocido (${file.name})`;
        if (shaCol >= 0) {
          const c = split(line); const v = c[shaCol];
          if (v && /^[0-9a-fA-F]{64}$/.test(v)) h = v;
          const sg = c[sigCol], ty = c[typeCol];
          const parts = [sg && sg !== 'n/a' ? sg : null, ty && ty !== 'n/a' ? `(${ty})` : null].filter(Boolean);
          if (parts.length) name = parts.join(' ');
        }
        if (!h) { const m = line.match(hexRe); h = m ? m[0] : null; }
        if (!h) { invalid++; continue; }
        read++; batch.push({ h: h.toLowerCase(), name, source });
        if (batch.length >= 5000) { added += await Store.putSigs(batch); batch = []; onProgress(read); }
      }
      if (batch.length) added += await Store.putSigs(batch);
      onProgress(read);
    }
    const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    if (head[0] === 0x50 && head[1] === 0x4B) {
      const entries = await CS.zipEntries(file);
      if (!entries) throw new Error('ZIP no válido');
      for (const e of entries) {
        const n = e.name.toLowerCase();
        if (n.endsWith('.txt') || n.endsWith('.csv')) await consumeText(new TextDecoder().decode(await CS.extractEntry(file, e)));
      }
    } else {
      await consumeText(await file.text());
    }
    await Store.log('Firmas importadas', `${file.name}: ${read} hashes leídos, ${added} nuevos, ${invalid} líneas inválidas`);
    return { read, added, invalid };
  }

  // ================================================================ exportación
  function pdfSafe(s) {
    return String(s).replace(/…/g, '...').replace(/[—–]/g, '-').replace(/[•·]/g, '-').replace(/→/g, '->').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
      .replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '?');
  }
  async function buildPdf(scan, findings, recs) {
    if (!window.jspdf) throw new Error('No se pudo cargar el generador de PDF');
    const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    const W = 595, M = 42; let y = M;
    const ensure = h => { if (y + h > 800) { doc.addPage(); y = M; } };
    const text = (s, size = 10, style = 'normal', color = [30, 30, 30], indent = 0) => {
      doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
      for (const line of doc.splitTextToSize(pdfSafe(s), W - 2 * M - indent)) { ensure(size + 4); doc.text(line, M + indent, y + size); y += size + 4; }
    };
    const section = s => { y += 8; ensure(30); text(s, 13, 'bold', [3, 105, 161]); doc.setDrawColor(200, 210, 220); doc.line(M, y, W - M, y); y += 6; };
    const lvl = currentLevel(findings);
    text('CyberSentinel Web - Informe de seguridad', 18, 'bold', [13, 27, 42]);
    text(`Generado: ${fmtDate(Date.now())}  |  Análisis #${scan.id} (${scan.type === 'FULL' ? 'completo' : 'rápido'})  |  Origen: ${scan.source}`, 9, 'normal', [90, 90, 90]);
    text(`Inicio: ${fmtDate(scan.startedAt)}  |  Fin: ${fmtDate(scan.finishedAt)}  |  Estado: ${scan.status}`, 9, 'normal', [90, 90, 90]);
    section('Resumen');
    const rows = [
      ['Nivel general de seguridad', `${CS.LABEL[lvl]} - ${CS.overallText(lvl)}`], ['Archivos analizados', scan.files], ['Archivos con SHA-256', scan.hashed],
      ['Archivos y carpetas ocultos', scan.hidden], ['Amenazas confirmadas', scan.critical],
      ['Elementos sospechosos', `${scan.high + scan.medium + scan.low} (ALTO ${scan.high}, MEDIO ${scan.medium}, BAJO ${scan.low})`],
      ['Aplicaciones revisadas', 'No disponible en la versión web (ver nota)'], ['Elementos no legibles', scan.errors], ['Firmas en la base local', state.sigCount]
    ];
    for (const [k, v] of rows) text(`${k}: ${v}`, 10);
    for (const n of scan.notes || []) text('Nota: ' + n, 9, 'italic', [120, 90, 0]);
    section('Recomendaciones');
    recs.forEach((r, i) => text(`${i + 1}. ${r}`, 10));
    const block = f => {
      ensure(40);
      text(`[${CS.LABEL[f.level]}] ${f.isDirectory ? 'Carpeta' : 'Archivo'}: ${f.name} - ${f.title}`, 10, 'bold');
      text(`Ubicación: ${f.location || '(raíz)'}  |  Tamaño: ${fmtSize(f.size)}  |  Tipo real: ${f.realTypeLabel || '-'}  |  Modificado: ${fmtDate(f.modifiedAt)}  |  Estado: ${statusLabel(f.status)}`, 8, 'normal', [90, 90, 90]);
      if (f.sha256) text('SHA-256: ' + f.sha256, 7.5, 'normal', [70, 70, 70]);
      for (const r of f.reasons.filter(x => x.startsWith('['))) text('- ' + r, 8.5, 'normal', [40, 40, 40], 10);
      y += 4;
    };
    const conf = findings.filter(f => f.level === 'CRITICAL');
    section(`Amenazas confirmadas (${conf.length})`);
    if (!conf.length) text('Ninguna coincidencia con firmas de malware de la base local.');
    conf.forEach(block);
    const sus = findings.filter(f => CS.W[f.level] >= 1 && CS.W[f.level] <= 3);
    section(`Elementos sospechosos (${sus.length})`);
    if (!sus.length) text('Ninguno.');
    sus.forEach(block);
    const hid = findings.filter(f => f.isHidden);
    section(`Archivos y carpetas ocultos (${hid.length})`);
    if (!hid.length) text('No se encontraron elementos ocultos.');
    hid.slice(0, 300).forEach(f => text(`${f.isDirectory ? '[carpeta]' : '[archivo]'} ${f.path} - ${fmtSize(f.size)} - mod. ${fmtDate(f.modifiedAt)} - ${CS.LABEL[f.level]}`, 8.5));
    section('Metodología y alcance');
    text('CRÍTICO se asigna sólo cuando el SHA-256 de un archivo coincide exactamente con una firma de la base local (o es el archivo de prueba EICAR). ALTO, MEDIO y BAJO surgen de reglas verificables: tipo real por firma de bytes, extensiones engañosas, ubicación, contenido de PDF/Office y permisos declarados en el manifiesto de los APK. Un nombre extraño por sí solo nunca se considera virus. Todo el análisis se hizo en el navegador, sin subir archivos a ningún servidor.', 9);
    text('Nota: una página web no puede ver las aplicaciones instaladas ni la configuración del teléfono; para eso se necesita la app Android de CyberSentinel.', 9, 'italic');
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text(`CyberSentinel Web - página ${i} de ${pages}`, M, 822); }
    return doc.output('arraybuffer');
  }
  async function save(filename, data) {
    if (state.downloads) {
      try { await state.downloads.save({ filename, data }); return true; }
      catch (e) { if (e && e.code !== 'declined') toast('No se pudo guardar: ' + (e.message || e.code)); return false; }
    }
    // Sitio publicado de forma independiente (por ejemplo, en Vercel): descarga normal del navegador.
    try {
      const url = URL.createObjectURL(new Blob([data]));
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (e) { toast('No se pudo guardar: ' + (e.message || e)); return false; }
  }

  // ================================================================ vistas

  function ringSvg(color, spinning, frac) {
    const r = 88, c = 2 * Math.PI * r;
    const arc = frac != null ? `<circle cx="105" cy="105" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c * frac).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 105 105)"/>` : '';
    return `<svg viewBox="0 0 210 210" aria-hidden="true">
      <circle cx="105" cy="105" r="${r}" fill="none" stroke="${color}" stroke-opacity=".14" stroke-width="10"/>
      ${spinning ? arc + `<g class="spinning"><circle cx="105" cy="105" r="${r}" fill="none" stroke="${color}" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" stroke-dasharray="70 ${c.toFixed(1)}"/></g>`
      : `<circle class="pulsing" cx="105" cy="105" r="${r}" fill="none" stroke="${color}" stroke-width="10"/>`}
      <g class="spinning" style="animation-duration:9s"><circle cx="105" cy="105" r="64" fill="none" stroke="${color}" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="300 102"/></g>
    </svg>`;
  }
  const levelColor = l => ({ CRITICAL: 'var(--crit)', HIGH: 'var(--high)', MEDIUM: 'var(--med)', LOW: 'var(--low)', SAFE: 'var(--green)' }[l] || 'var(--dim)');

      <span><span class="name">${esc(f.name)}</span><br><span class="sub">${esc(f.title)} · ${esc(f.location || '(raíz)')}</span><br><span class="sub">${esc(meta)}</span></span>
      ${pill(f.level)}</button>`;

      </div>`;
    const src = () => (main.querySelector('input[name="src"]:checked') || {}).value || 'folder';
    const bq = $('#b-quick'), bf = $('#b-full'), bs = $('#b-see');
    if (bq) bq.onclick = () => startFlow(src(), 'QUICK');
    if (bf) bf.onclick = () => startFlow(src(), 'FULL');
    if (bs) bs.onclick = () => go('analisis');
    const drop = $('#drop');
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = async e => {
      e.preventDefault(); drop.classList.remove('over');
      if (state.running) return;
      const out = { files: [], dirs: [], errors: 0, source: 'elementos arrastrados' };
      const items = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
      if (items.length) for (const en of items) await walkEntry(en, '', out);
      else for (const f of e.dataTransfer.files) out.files.push({ file: f, path: f.name });
      runScan(out, 'QUICK');
    };
  }

  // ---------------------------------------------------------------- Archivos
  async function vArchivos(main) {

      </div>
      ${tab === 'risky' ? `<div class="chips">${['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'].map(l => `<button class="chip ${state.minLevel === l ? 'on' : ''}" data-min="${l}">${l === 'LOW' ? 'Todos' : CS.LABEL[l] + ' o más'}</button>`).join('')}</div>` : ''}

  // ---------------------------------------------------------------- Detalle
  async function openFinding(id) {
    const f = await Store.finding(id); if (!f) return;
    const trusted = f.sha256 ? await Store.isTrusted(f.sha256) : false;
    const lv = f.reasons.filter(r => r.startsWith('[')), info = f.reasons.filter(r => !r.startsWith('['));
    const canQ = !f.isDirectory && (f.status === 'OPEN' || f.status === 'IGNORED') && state.handles.has(f.path);
    modal(`<div class="row"><h3 style="flex:1">${esc(f.name)}</h3>${pill(f.level)}</div>
      <div class="L-${f.level}" style="margin-bottom:6px">${esc(f.title)}</div>
      ${f.status !== 'OPEN' ? `<div class="small" style="color:var(--blue)">Estado: ${statusLabel(f.status)}</div>` : ''}
      ${lv.length ? `<h2>Por qué tiene este nivel</h2><ul class="reasons">${lv.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
      ${info.length ? `<h2>Información</h2><ul class="reasons muted small">${info.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
      <h2>Datos</h2><dl class="kv">
        <dt>Ruta</dt><dd>${esc(f.path)}</dd>
        ${f.isDirectory ? '' : `<dt>Tamaño</dt><dd>${fmtSize(f.size)}</dd><dt>Tipo real (por contenido)</dt><dd>${esc(f.realTypeLabel || 'no determinado')}</dd>`}
        <dt>Creación</dt><dd>no disponible (el navegador no la informa)</dd>
        <dt>Modificación</dt><dd>${fmtDate(f.modifiedAt)}</dd>
        <dt>Oculto</dt><dd>${f.isHidden ? 'Sí' : 'No'}</dd>
        ${f.packageName ? `<dt>Paquete Android</dt><dd class="mono">${esc(f.packageName)}</dd>` : ''}
        ${f.sha256 ? `<dt>SHA-256</dt><dd class="mono">${f.sha256}</dd>` : ''}
      </dl>
      <h2>Acciones</h2>
      <div class="row">
        ${!f.isDirectory && (f.status === 'OPEN' || f.status === 'IGNORED') ? `<button class="btn danger" id="d-q" ${canQ ? '' : 'disabled'}>Poner en cuarentena</button>` : ''}
        ${f.sha256 && f.level !== 'CRITICAL' && f.status !== 'QUARANTINED' ? `<button class="btn blue" id="d-t">${trusted ? 'Quitar de confiables' : 'Marcar como confiable'}</button>` : ''}
        ${f.sha256 ? '<button class="btn" id="d-c">Copiar SHA-256</button>' : ''}
        <span class="spacer"></span><button class="btn" id="d-x">Cerrar</button>
      </div>
      ${!f.isDirectory && f.status === 'OPEN' && !canQ ? '<p class="small muted">La cuarentena sólo funciona con carpetas abiertas con acceso de escritura en esta sesión (Chrome o Edge de computadora). Si no, podés borrar el archivo a mano desde la ruta indicada.</p>' : ''}`,
      (m, close) => {
        m.querySelector('#d-x').onclick = close;
        const c = m.querySelector('#d-c'); if (c) c.onclick = () => copy(f.sha256);
        const q = m.querySelector('#d-q');
        if (q) q.onclick = async () => {
          if (!await confirmBox('¿Poner en cuarentena?', `"${f.name}" se guardará aislado y ofuscado dentro del navegador y se quitará de ${f.location}. Se verifica con SHA-256 antes de borrar el original. Podés restaurarlo cuando quieras.`, 'Mover a cuarentena', true)) return;
          try { await quarantine(f); toast('Archivo movido a cuarentena'); close(); await refreshCounts(); render(); }
          catch (e) { toast(e.message || String(e)); }
        };
        const t = m.querySelector('#d-t');
        if (t) t.onclick = async () => {
          const on = !trusted;
          if (!await confirmBox(on ? '¿Marcar como confiable?' : '¿Quitar de confiables?', on ? 'No contará para el nivel de riesgo en próximos análisis (salvo que coincida con malware conocido). Hacelo sólo si sabés qué es.' : 'Volverá a evaluarse normalmente.', on ? 'Marcar' : 'Quitar')) return;
          await Store.setTrusted(f.sha256, on);
          f.status = on ? 'IGNORED' : 'OPEN'; await Store.putFinding(f);
          await Store.log(on ? 'Marcado como confiable' : 'Quitado de confiables', `${f.path} (${f.sha256})`);
          toast('Listo'); close(); render();
        };
      });
  }

  // ---------------------------------------------------------------- APK y apps
  async function vApk(main) {
    main.innerHTML = `<h1>APK y aplicaciones</h1>
      <p class="lead">Una página web no puede ver las apps instaladas ni sus permisos: el navegador lo impide por seguridad. Lo que sí podés hacer acá es revisar <b>instaladores APK</b> antes de instalarlos. Se lee su manifiesto sin instalarlos ni ejecutarlos.</p>
      <div class="row"><button class="btn primary" id="b-apk">Elegir APK…</button><input type="file" id="in-apk" accept=".apk,.xapk,.apks,application/vnd.android.package-archive" class="hidden" multiple></div>
      <div id="apk-out" class="list" style="margin-top:16px"></div>
      <h2>Para analizar las apps instaladas</h2>
      <p class="small muted">La app Android de CyberSentinel revisa origen de instalación, permisos concedidos, accesibilidad y administración del dispositivo activos, e imitaciones de apps conocidas. Necesita compilarse e instalarse en el teléfono.</p>`;
    const inp = $('#in-apk');
    $('#b-apk').onclick = () => { inp.value = ''; inp.click(); };
    inp.onchange = async () => {
      const out = $('#apk-out'); out.innerHTML = '<p class="muted">Analizando…</p>';
      const cards = [];
      for (const file of inp.files) {
        try {
          const r = await CS.analyzeFile(file, { path: file.name, hashLimit: settings.hashMb * 1024 * 1024, lookupSig: h => Store.getSig(h), isTrusted: h => Store.isTrusted(h), isCancelled: () => false });
          let perms = '';
          if (r.realType === 'APK') {
            const entries = await CS.zipEntries(file);
            const me = entries && entries.find(e => e.name === 'AndroidManifest.xml');
            if (me) {
              try {
                const mf = CS.parseAXML(await CS.extractEntry(file, me));
                perms = `<table class="t"><tr><th>Permiso solicitado</th><th>Sensible</th></tr>${mf.permissions.map(p => `<tr><td>${esc(CS.permLabel(p))}<div class="mono muted">${esc(p)}</div></td><td>${p.startsWith('android.permission.') && CS.permLabel(p) !== p.split('.').pop() ? '<span class="L-MEDIUM">Sí</span>' : 'No'}</td></tr>`).join('')}</table>
                  ${mf.services.length ? `<div class="small muted" style="margin-top:8px">Servicios: ${mf.services.map(s => esc((s.name || '?') + (s.permission ? ' [' + s.permission.split('.').pop() + ']' : ''))).join(', ')}</div>` : ''}`;
              } catch (_) { perms = '<p class="small muted">No se pudo leer el manifiesto.</p>'; }
            }
          }
          await Store.log('APK analizado', `${file.name}: ${CS.LABEL[r.level]}`);
          cards.push(`<div class="card"><div class="row"><b style="flex:1;overflow-wrap:anywhere">${esc(file.name)}</b>${pill(r.level)}</div>
            <div class="small muted">${esc(r.realTypeLabel)} · ${fmtSize(file.size)}${r.packageName ? ' · ' + esc(r.packageName) : ''}</div>
            <ul class="reasons small" style="margin-top:8px">${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
            ${r.sha256 ? `<div class="mono muted" style="margin-top:6px">SHA-256 ${r.sha256}</div>` : ''}${perms}</div>`);
        } catch (e) { cards.push(`<div class="banner">${esc(file.name)}: ${esc(e.message || e)}</div>`); }
      }
      out.innerHTML = cards.join('');
    };
  }

    const fs = (await Store.findings(s.id)).sort((a, b) => CS.W[b.level] - CS.W[a.level]);

        <div class="card tile"><div class="n" style="color:var(--blue)">${s.hidden}</div><div class="l">Ocultos</div></div>
        <div class="card tile"><div class="n" style="color:${s.critical ? 'var(--crit)' : 'var(--green)'}">${s.critical}</div><div class="l">Amenazas confirmadas</div></div>
        <div class="card tile"><div class="n" style="color:var(--med)">${s.high}/${s.medium}/${s.low}</div><div class="l">Sospechosos ALTO / MEDIO / BAJO</div></div>
      </div>

    bindItems(main);

    $('#b-pdf').onclick = async () => {
      try { const buf = await buildPdf(s, fs, recs); if (await save(`CyberSentinel-informe-${s.id}-${stamp}.pdf`, buf)) { await Store.log('Informe PDF exportado', `#${s.id}`); toast('Informe PDF guardado'); } }

  }

        <p class="small muted">Los archivos más grandes se analizan por tipo, nombre, ubicación y contenido inicial, sin hash (se indica en el informe).</p></div>
      ${trusted.length ? `<h2>Marcados como confiables</h2><div class="card"><table class="t">${trusted.map(h => `<tr><td class="mono">${h}</td><td style="text-align:right"><button class="btn ghost" data-tr="${h}">Quitar</button></td></tr>`).join('')}</table></div>` : ''}
      <h2>Usar sin depender de esta página</h2>
      <div class="card"><p class="small muted" style="margin-top:0">Guardá la herramienta como un único archivo .html y abrilo en Chrome o Edge de tu computadora. Abierto así, el navegador permite elegir carpetas con acceso de escritura y la cuarentena funciona de verdad.</p>
        <button class="btn blue" id="b-self" >Descargar CyberSentinel.html</button></div>
      <h2>Privacidad y permisos</h2>
      <div class="card small"><ul class="reasons">
        <li>Todo el análisis ocurre en tu navegador. La página no puede conectarse a servidores externos: ningún archivo ni resultado sale de tu dispositivo.</li>
        <li>Sólo lee las carpetas o archivos que vos elegís, y sólo durante esta sesión.</li>
        <li>Para la cuarentena pide permiso de escritura sobre la carpeta elegida; lo usa sólo cuando confirmás.</li>
        <li>Historial, firmas, cuarentena y registro se guardan en el almacenamiento de este navegador. Si borrás los datos del sitio, se pierden.</li>
      </ul><div class="row" style="margin-top:8px"><a href="#registro">Ver registro de acciones</a></div></div>`;
    const st = $('#imp-st'), inp = $('#in-sig');
    $('#b-imp').onclick = () => { inp.value = ''; inp.click(); };
    inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      $('#b-imp').disabled = true; st.textContent = 'Importando…';
      try {
        const r = await importSignatures(file, n => { st.textContent = `Importando… ${n} leídas`; });
        toast(r.read ? `${r.read} hashes leídos, ${r.added} nuevos` : 'El archivo no contiene hashes SHA-256 válidos');
      } catch (e) { toast('No se pudo importar: ' + (e.message || e)); }
      await refreshCounts(); vAjustes(main);
    };
    $('#b-h').onclick = async () => {
      const h = $('#h-in').value.trim().toLowerCase();
      if (!/^[0-9a-f]{64}$/.test(h)) { toast('Eso no es un SHA-256 válido (64 caracteres hexadecimales)'); return; }
      const name = $('#h-name').value.trim() || 'Firma agregada manualmente';
      const n = await Store.putSigs([{ h, name, source: 'Manual' }]);
      await Store.log('Firma agregada', `${h} — ${name}`);
      toast(n ? 'Firma agregada' : 'Esa firma ya estaba en la base'); await refreshCounts(); vAjustes(main);
    };
    const mb = $('#mb');
    mb.oninput = () => { $('#mb-v').textContent = mb.value; };
    mb.onchange = () => { settings.hashMb = Number(mb.value); toast('Límite guardado'); };
    main.querySelectorAll('[data-src]').forEach(b => b.onclick = async () => {
      if (!await confirmBox('¿Quitar firmas?', `Se eliminarán todas las firmas de "${b.dataset.src}".`, 'Quitar', true)) return;
      await Store.deleteSource(b.dataset.src); await Store.log('Firmas eliminadas', b.dataset.src); await refreshCounts(); vAjustes(main);
    });
    main.querySelectorAll('[data-tr]').forEach(b => b.onclick = async () => { await Store.setTrusted(b.dataset.tr, false); await Store.log('Quitado de confiables', b.dataset.tr); vAjustes(main); });
    $('#b-self').onclick = () => save('CyberSentinel.html', SELF_HTML);
  }

  // ---------------------------------------------------------------- Registro
  async function vRegistro(main) {
    const l = await Store.logs();
    main.innerHTML = `<h1>Registro de acciones</h1><p class="lead">Análisis, cuarentenas, restauraciones, importaciones y exportaciones, con fecha y hora.</p>
      <div class="card">${l.length ? `<table class="t"><tr><th>Fecha</th><th>Acción</th><th>Detalle</th></tr>${l.map(e => `<tr><td style="white-space:nowrap">${fmtDate(e.ts)}</td><td style="color:var(--green)">${esc(e.action)}</td><td style="overflow-wrap:anywhere">${esc(e.detail)}</td></tr>`).join('')}</table>` : '<p class="muted">El registro está vacío.</p>'}</div>`;
  }

  // ================================================================ arranque
  (async () => {
    await Store.open();
    try { if (!(await Store.getSig(EICAR_SHA))) await Store.putSigs([{ h: EICAR_SHA, name: 'EICAR-Test-File (archivo de prueba estándar)', source: 'Incluida' }]); } catch (_) { }
    await refreshCounts();
    render();
    // La función de descargas la provee el visor de Claude; puede llegar un poco después de cargar.
    for (let i = 0; i < 20 && !state.downloads; i++) {
      try {
        if (window.claude && typeof window.claude.use === 'function') {
          state.downloads = await window.claude.use('downloads');
          if (state.downloads && (state.view === 'informe' || state.view === 'ajustes')) render();
          break;
        }
      } catch (_) { break; }
      await new Promise(r => setTimeout(r, 500));
    }
  })();
})();

</script>
</body>
</html>

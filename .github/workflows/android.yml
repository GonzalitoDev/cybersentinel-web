name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - id: checkout
        uses: actions/checkout@v5

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - id: sdk
        name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - id: tests
        name: Pruebas de las reglas de detección
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee ../tests.log

      - id: build
        name: Compilar APK
        env:
          KEYSTORE_B64: ${{ secrets.CS_KEYSTORE_BASE64 }}
          CS_KEYSTORE_PASSWORD: ${{ secrets.CS_KEYSTORE_PASSWORD }}
          CS_KEY_ALIAS: ${{ secrets.CS_KEY_ALIAS }}
          CS_KEY_PASSWORD: ${{ secrets.CS_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CS_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease 2>&1 | tee ../build.log
            cp app/build/outputs/apk/release/app-release.apk CyberSentinel-Mobile.apk
            echo "Firmado con la clave de publicación." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Sin secretos de firma: se compila con la clave de depuración."
            ./gradlew --no-daemon assembleDebug 2>&1 | tee ../build.log
            cp app/build/outputs/apk/debug/app-debug.apk CyberSentinel-Mobile.apk
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Mostrar errores
        if: failure()
        working-directory: .
        run: |
          {
            echo "## Pasos"
            echo "checkout=${{ steps.checkout.outcome }} java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}"
            for f in tests.log build.log; do
              [ -f "$f" ] || continue
              echo "## $f"
              echo '```'
              grep -E "^e: |error:|What went wrong|FAILED|Could not|Exception|> " "$f" | head -80
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::pasos checkout=${{ steps.checkout.outcome }} java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}"
          for f in tests.log build.log; do
            [ -f "$f" ] && grep -E "^e: |error:|What went wrong|Could not" "$f" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
          done
          true

      - uses: actions/upload-artifact@v4
        with:
          name: CyberSentinel-Mobile
          path: android/CyberSentinel-Mobile.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CyberSentinel Mobile (última compilación)
          body: |
            APK compilado automáticamente desde `main` y firmado con la clave de publicación de GonzaDev (SHA-256 del certificado: BD:21:0C:CB:F7:94:28:9F:FF:8C:59:3A:B5:83:72:9F:94:90:99:E8:18:AF:96:6B:F1:E6:F1:BA:9D:BC:8D:83).
            Para instalarlo, permití "instalar apps desconocidas" para tu navegador o gestor de archivos.
          files: android/CyberSentinel-Mobile.apk
          make_latest: true

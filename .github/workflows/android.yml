name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - id: checkout
        uses: actions/checkout@v5

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - id: sdk
        name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - id: tests
        name: Pruebas de las reglas de detección
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee ../tests.log

      - id: build
        name: Compilar APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk CyberSentinel-Mobile.apk

      - name: Mostrar errores
        if: failure()
        working-directory: .
        run: |
          {
            echo "## Pasos"
            echo "checkout=${{ steps.checkout.outcome }} java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}"
            for f in tests.log build.log; do
              [ -f "$f" ] || continue
              echo "## $f"
              echo '```'
              grep -E "^e: |error:|What went wrong|FAILED|Could not|Exception|> " "$f" | head -80
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::pasos checkout=${{ steps.checkout.outcome }} java=${{ steps.java.outcome }} sdk=${{ steps.sdk.outcome }} tests=${{ steps.tests.outcome }} build=${{ steps.build.outcome }}"
          for f in tests.log build.log; do
            [ -f "$f" ] && grep -E "^e: |error:|What went wrong|Could not" "$f" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
          done
          true

      - uses: actions/upload-artifact@v4
        with:
          name: CyberSentinel-Mobile
          path: android/CyberSentinel-Mobile.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CyberSentinel Mobile (última compilación)
          body: |
            APK compilado automáticamente desde `main` (firmado con clave de depuración).
            Para instalarlo, permití "instalar apps desconocidas" para tu navegador o gestor de archivos.
          files: android/CyberSentinel-Mobile.apk
          make_latest: true

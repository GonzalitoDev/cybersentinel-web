name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de las reglas de detección
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CyberSentinel-Mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CyberSentinel-Mobile
          path: android/CyberSentinel-Mobile.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: CyberSentinel Mobile (última compilación)
          body: |
            APK de prueba compilado automáticamente desde `main` (firmado con clave de depuración).
            Para instalarlo, permití "instalar apps desconocidas" para tu navegador o gestor de archivos.
          files: android/CyberSentinel-Mobile.apk
          make_latest: true
